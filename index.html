<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cardoso Climatização</title>
    <link rel="icon" type="image/png" href="/icons/logo.png" id="favicon-link" />
    <link rel="apple-touch-icon" href="/icons/logo.png" id="apple-touch-icon-link" />
    <script>
      (function() {
        try {
          const savedLogo = localStorage.getItem('companyLogo');
          if (savedLogo) {
            document.getElementById('favicon-link').href = savedLogo;
            document.getElementById('apple-touch-icon-link').href = savedLogo;
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var savedPreference = localStorage.getItem('theme');
          var isDark = savedPreference === 'dark' || (!savedPreference && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
